# Builds the tool from this exact source on GitHub's own machines, then publishes:
#   - the binaries, a SHA256SUMS.txt file, and
#   - a signed build-provenance attestation (proves each file was built here, from this commit).
# Check a download with:  gh attestation verify <file> --repo <owner>/<repo>
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write       # create the GitHub release
  id-token: write       # sign the attestation (Sigstore)
  attestations: write   # store the attestation

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macOS is cross-built on Linux with cargo-zigbuild: GitHub's macOS runners are often
        # unavailable for long stretches, and the tool needs no macOS frameworks.
        include:
          - { os: windows-latest, targets: x86_64-pc-windows-msvc,                    outs: ai-relay-windows-x64.exe,                  bin: ai-relay.exe, zig: false }
          - { os: ubuntu-latest,  targets: aarch64-apple-darwin x86_64-apple-darwin, outs: ai-relay-macos-arm64 ai-relay-macos-x64, bin: ai-relay,     zig: true }
          - { os: ubuntu-latest,  targets: x86_64-unknown-linux-musl,                 outs: ai-relay-linux-x64,                        bin: ai-relay,     zig: false }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.targets }}
      - name: musl tools
        if: contains(matrix.targets, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: zig cross-compiler
        if: matrix.zig
        run: pip install ziglang cargo-zigbuild
      # The UI font is not in this repo; it is added to release builds from repository secrets
      # (FONT_REGULAR / FONT_BOLD / FONT_EXTRABOLD = base64 of the .woff2 files). Without them the
      # build still succeeds and the UI uses the system font.
      - name: UI font
        shell: bash
        env:
          FONT_REGULAR: ${{ secrets.FONT_REGULAR }}
          FONT_BOLD: ${{ secrets.FONT_BOLD }}
          FONT_EXTRABOLD: ${{ secrets.FONT_EXTRABOLD }}
        run: |
          if [ -n "$FONT_REGULAR" ] && [ -n "$FONT_BOLD" ] && [ -n "$FONT_EXTRABOLD" ]; then
            mkdir -p fonts
            printf '%s' "$FONT_REGULAR"   | base64 -d > fonts/Satrap-Regular.woff2
            printf '%s' "$FONT_BOLD"      | base64 -d > fonts/Satrap-Bold.woff2
            printf '%s' "$FONT_EXTRABOLD" | base64 -d > fonts/Satrap-ExtraBold.woff2
            echo "font added"
          else
            echo "font secrets not set: building with the system font"
          fi
      - name: Build and collect
        shell: bash
        run: |
          mkdir dist
          targets=(${{ matrix.targets }}); outs=(${{ matrix.outs }})
          for i in "${!targets[@]}"; do
            if [ "${{ matrix.zig }}" = "true" ]; then
              cargo zigbuild --release --locked --target "${targets[$i]}"
            else
              cargo build --release --locked --target "${targets[$i]}"
            fi
            cp "target/${targets[$i]}/release/${{ matrix.bin }}" "dist/${outs[$i]}"
          done
          ls -la dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.os }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Publish whatever built, even if one platform failed (its file is simply missing).
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

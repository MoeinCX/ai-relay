[package]
name = "ai-relay"
version = "1.0.0"
edition = "2021"
description = "Sets up a private AI API relay on your own Cloudflare account (Cloudflare Workers)."
license = "MIT"

[dependencies]
tiny_http = "0.12"
ureq = { version = "2", default-features = false, features = ["tls"] }
serde_json = "1"
getrandom = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
